<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIS – Tổng quan</title>
  <script>
    const bookmark = new URL(location.href);
    const asset = bookmark.searchParams.get('asset') || bookmark.searchParams.get('coin');
    const overview = new URL('./index.html#overview', bookmark);
    if (asset) overview.searchParams.set('asset', asset);
    location.replace(overview.href);
  </script>
</head>
<body>
  <p><a href="./index.html#overview">Mở Tổng quan MIS</a></p>
</body>
</html>
