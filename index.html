<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f43">
  <title>MIS – My Investment System</title>
  <link rel="icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./mis_workspace.css">
  <script defer src="./ces_engine.js"></script>
  <script defer src="./ces_config.js"></script>
  <script defer src="./ces_dynamic.js"></script>
  <script defer src="./ces_shared.js"></script>
  <script defer src="./ces_library.js"></script>
  <script defer src="./ces_optimizer_data.js"></script>
  <script defer src="./mis_workspace.js"></script>
</head>
<body>
  <header class="header">
    <div class="masthead">
      <div><div class="brand">MIS <span> / </span> My Investment System</div><div class="version">V1.7.0 · Bản phát triển</div></div>
      <label class="asset">Tài sản <select id="workspace-asset" aria-label="Tài sản">
        <option>BTC</option><option>ETH</option><option>BNB</option><option>SOL</option>
        <option>LINK</option><option>AVAX</option><option>SUI</option><option>OKB</option>
      </select></label>
    </div>
    <nav aria-label="Điều hướng chính" id="workspace-nav">
      <a href="#overview">Tổng quan</a><a href="#indicators">Bộ chỉ báo</a>
      <a href="#research">Research</a><a href="#backtest">Backtest</a><a href="#data">Data Hub</a>
    </nav>
  </header>
  <main>
    <div class="section-head">
      <div><h1 id="workspace-title"></h1><p id="workspace-description"></p></div>
      <div id="workspace-tools" aria-label="Công cụ của màn hình"></div>
    </div>
    <section id="workspace-library" aria-label="Thư viện cấu hình" hidden>
      <h2>Cấu hình Live Monitor hiện đọc</h2>
      <p id="workspace-config"></p>
      <h2>Cấu hình đối chứng</h2>
      <div id="workspace-candidates"></div>
    </section>
    <section id="workspace-overview" aria-label="Theo dõi thị trường">
      <div id="workspace-monitor" role="region" aria-label="Tín hiệu CES">
        <p role="status">Đang tải bảng tín hiệu…</p>
      </div>
      <details id="workspace-chart"><summary>Biểu đồ thị trường</summary></details>
    </section>
    <div id="workspace-frames"></div>
    <noscript>Bật JavaScript để sử dụng MIS.</noscript>
  </main>
</body>
</html>
