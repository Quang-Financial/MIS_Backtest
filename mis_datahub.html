<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIS Data Hub V1.6.6.1</title><style>body{font:16px system-ui;background:#f0f5fa;color:#17334d;max-width:1000px;margin:16px auto;padding:0 12px}section{background:white;padding:16px;border-radius:12px;margin:12px 0}button,a{background:#123c63;color:white;border:0;border-radius:7px;padding:10px;text-decoration:none;font:inherit;display:inline-block;margin:4px}select,input{font:inherit;max-width:100%;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:right}.scroll{overflow:auto}svg{width:100%;height:auto}</style><h2>MIS Data Hub V1.6.6.1</h2><a href="ces_history.html?v=1661">Historical Research</a><a href="index.html?v=1661">Trang chính</a><section><h3>Nguồn dữ liệu độc lập</h3><p>Không ghép USD và USDT. Coin Metrics chỉ đối chiếu giá tham chiếu. Không tự điền nến thiếu.</p><button data-download="bitstamp">Tải / cập nhật Bitstamp</button><button data-download="binance">Tải / cập nhật Binance</button><button data-download="metrics">Tải Coin Metrics</button><p>Nhập CSV OHLC hoặc JSON bars (timestamp ms). Nguồn nhập được lưu riêng.</p><input id="file" type="file" accept=".csv,.json"><button id="import">Nhập</button><pre id="status" role="status"></pre><div id="inventory"></div></section><section><h3>Kiểm toán và đối chiếu</h3><select id="source"><option value="bitstamp">Bitstamp</option><option value="legacy">MIS cũ</option><option value="binance">Binance</option><option value="imported">Nhập riêng</option></select><button id="audit">Kiểm toán nguồn</button><button id="compare">Đối chiếu các nguồn đã lưu</button><button id="export" disabled>Xuất JSON Audit</button><pre id="summary"></pre><div id="chart"></div><div class="scroll" id="weeks"></div></section><script src="ces_engine.js?v=1661"></script><script>const day=86400000,status=s=>document.getElementById('status').textContent=s;</script><script src="ces_optimizer_data.js?v=1661"></script><script src="mis_datahub.js?v=1661"></script><script src="ces_report.js?v=1661"></script><script>
const $=id=>document.getElementById(id);let report;async function inventory(){let a=[];for(const k of ['bitstamp','binance','metrics','imported']){const v=await MISDataHub.store(k);a.push(MISDataHub.sources[k]+': '+(v?(v.audit?`${v.audit.from} – ${v.audit.to}, ${v.audit.days} nến, ${v.audit.gaps.length} gap`:`${v.prices.length} giá tham chiếu`):'Chưa tải'))}$('inventory').textContent=a.join(' | ')}async function job(fn){const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn();await inventory();status('Hoàn thành')}catch(e){status('Lỗi: '+e.message+' — nếu API bị chặn/CORS, dùng CSV/JSON nhập riêng.')}finally{buttons.forEach(b=>b.disabled=false);$('export').disabled=!report}}document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>job(()=>MISDataHub.download(b.dataset.download,status)));$('import').onclick=()=>job(async()=>{const f=$('file').files[0];if(!f)throw Error('Chọn file');const bars=MISDataHub.parse(await f.text());await MISDataHub.store('imported',{source:f.name,bars,audit:MISDataHub.audit(bars),updated:new Date().toISOString()})});$('audit').onclick=()=>job(async()=>{const key=$('source').value,a=await MISDataHub.load(key),audit=MISDataHub.audit(a),weeks=MISDataHub.weekly(a),period=weeks.filter(x=>x.date>='2018-01-01');report={version:'1.6.6.1',source:MISDataHub.sources[key],audit,weeks,drawdown:[40,45,50,55,60].map(n=>({threshold:n,eligible:period.filter(x=>x.dd<=-n&&x.below).length}))};$('summary').textContent=JSON.stringify({...report,weeks:undefined},null,2);const el=$('weeks');el.replaceChildren();const t=document.createElement('table');for(const row of [['Ngày xác nhận UTC','Close','EMA200','ATH','DD %','Dưới EMA'],...period.map(x=>[x.date,x.close,x.ema200,x.ath,x.dd,x.below?'Có':'Không'])]){const tr=t.insertRow();for(const v of row)tr.insertCell().textContent=typeof v==='number'?v.toFixed(2):v??'—'}el.append(t);const p=period.filter(x=>x.ema200>0);if(p.length){const max=Math.max(...p.map(x=>Math.log(x.close)),...p.map(x=>Math.log(x.ema200))),min=Math.min(...p.map(x=>Math.log(x.close)),...p.map(x=>Math.log(x.ema200)));const pts=k=>p.map((x,i)=>`${10+i*580/Math.max(1,p.length-1)},${190-180*(Math.log(x[k])-min)/(max-min||1)}`).join(' ');$('chart').innerHTML=`<svg viewBox="0 0 600 210"><polyline points="${pts('close')}" fill="none" stroke="#123c63"/><polyline points="${pts('ema200')}" fill="none" stroke="#c28b23"/></svg><small>Close xanh · EMA200 vàng · thang log · ${p[0].date} – ${p.at(-1).date}</small>`}});$('compare').onclick=()=>job(async()=>{const a=await MISDataHub.load($('source').value),comparisons=[];for(const k of ['bitstamp','binance','metrics','imported']){if(k===$('source').value)continue;const v=await MISDataHub.store(k);if(v)comparisons.push({source:v.source,...MISDataHub.compare(a,v.bars||v.prices)})}report={version:'1.6.6.1',source:$('source').value,comparisons};$('summary').textContent=JSON.stringify(report,null,2)});$('export').onclick=()=>MISReport.download(new Blob([MISReport.bytes(report)],{type:'application/json'}),'MIS_data_audit.json');inventory().catch(e=>status(e.message));</script><script src="mis_update.js?v=1661"></script></html>
